version: '3.8'

services:
  # ─── API NestJS ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: stayride-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stayride-network

  # ─── PostgreSQL 16 ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stayride-postgres
    environment:
      POSTGRES_DB: stayride_dev
      POSTGRES_USER: stayride
      POSTGRES_PASSWORD: dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayride -d stayride_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stayride-network

  # ─── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stayride-redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stayride-network

  # ─── MailHog (emails en développement) ────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: stayride-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web
    networks:
      - stayride-network

  # ─── Adminer (interface PostgreSQL) ───────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: stayride-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - stayride-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  stayride-network:
    driver: bridge
